training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 0.00005
  lr_scheduler_type: "cosine"
  max_length: 1536
  beta: 0.1
  optim: "adamw_torch"
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2
  logging_steps: 1
  disable_tqdm: false
  bf16: true
  report_to: "tensorboard"
  run_name: "smolk12_dpo"
  remove_unused_columns: false
